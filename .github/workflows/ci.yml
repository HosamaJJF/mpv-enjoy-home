name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and Svelte
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build

  rust-quality:
    name: Rust quality (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2025
          - label: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2; LGPL-3.0 CI cache tooling
        with:
          workspaces: './src-tauri -> target'

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Test release asset packaging
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/test-upload-release-assets.sh

  native:
    name: Native (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2025
          - label: macOS Apple Silicon
            os: macos-15
          - label: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2; LGPL-3.0 CI cache tooling
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build desktop application
        if: runner.os != 'Windows'
        run: npm run tauri build -- --no-bundle

      - name: Build Windows candidate bundles
        if: runner.os == 'Windows'
        run: npm run tauri build

      - name: Package Windows candidate bundles
        id: package_windows_candidate
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          PREFIX="mpv-enjoy-home-${VERSION}-windows-x64"
          OUTPUT_DIR="build/test-artifacts"
          PORTABLE_DIR="${OUTPUT_DIR}/${PREFIX}"

          shopt -s nullglob
          NSIS_BUNDLES=(src-tauri/target/release/bundle/nsis/*.exe)
          MSI_BUNDLES=(src-tauri/target/release/bundle/msi/*.msi)
          if [[ "${#NSIS_BUNDLES[@]}" -ne 1 || "${#MSI_BUNDLES[@]}" -ne 1 ]]; then
            echo "expected exactly one NSIS and one MSI bundle" >&2
            exit 1
          fi

          mkdir -p "${PORTABLE_DIR}"
          cp "${NSIS_BUNDLES[0]}" "${OUTPUT_DIR}/${PREFIX}-setup.exe"
          cp "${MSI_BUNDLES[0]}" "${OUTPUT_DIR}/${PREFIX}.msi"
          cp src-tauri/target/release/mpv-enjoy-home.exe "${PORTABLE_DIR}/"
          cp LICENSE "${PORTABLE_DIR}/"
          touch "${PORTABLE_DIR}/.mpv-enjoy-home-portable"
          CANDIDATE_SOURCE="${PORTABLE_DIR}" \
            CANDIDATE_DESTINATION="${OUTPUT_DIR}/${PREFIX}.zip" \
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command \
            'Compress-Archive -LiteralPath $env:CANDIDATE_SOURCE -DestinationPath $env:CANDIDATE_DESTINATION -CompressionLevel Optimal -Force'

          tar -tf "${OUTPUT_DIR}/${PREFIX}.zip" \
            | grep -Fxq "${PREFIX}/.mpv-enjoy-home-portable"
          cd "${OUTPUT_DIR}"
          sha256sum \
            "${PREFIX}-setup.exe" \
            "${PREFIX}.msi" \
            "${PREFIX}.zip" \
            >SHA256SUMS.txt
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"

      - name: Upload Windows candidate artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mpv-enjoy-home-${{ steps.package_windows_candidate.outputs.version }}-windows-x64-candidate
          path: |
            build/test-artifacts/mpv-enjoy-home-${{ steps.package_windows_candidate.outputs.version }}-windows-x64-setup.exe
            build/test-artifacts/mpv-enjoy-home-${{ steps.package_windows_candidate.outputs.version }}-windows-x64.msi
            build/test-artifacts/mpv-enjoy-home-${{ steps.package_windows_candidate.outputs.version }}-windows-x64.zip
            build/test-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
