name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and Svelte
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build

  rust-quality:
    name: Rust quality (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2025
          - label: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2; LGPL-3.0 CI cache tooling
        with:
          workspaces: './src-tauri -> target'

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Test release asset packaging
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/test-upload-release-assets.sh

  native:
    name: Native (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2025
          - label: macOS Apple Silicon
            os: macos-15
          - label: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2; LGPL-3.0 CI cache tooling
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build desktop application
        run: npm run tauri build -- --no-bundle

      - name: Package Windows test bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p build/test-artifacts/windows-x64
          cp src-tauri/target/release/mpv-enjoy-home.exe build/test-artifacts/windows-x64/
          cp LICENSE build/test-artifacts/windows-x64/
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command \
            "Compress-Archive -Path 'build/test-artifacts/windows-x64/*' -DestinationPath 'build/test-artifacts/mpv-enjoy-home-windows-x64.zip' -Force"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-enjoy-home-${{ matrix.label }}
          path: |
            build/test-artifacts/mpv-enjoy-home-windows-x64.zip
            src-tauri/target/release/mpv-enjoy-home.exe
            src-tauri/target/release/mpv-enjoy-home
          if-no-files-found: ignore
